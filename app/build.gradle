plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// 统一签名：keystore.properties 与 keystore/less-release.jks 一起提交在仓库里，
// 保证任何机器构建出的 APK 签名一致，可以互相覆盖安装。
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.kkorpse.less'
    compileSdk 36

    defaultConfig {
        applicationId "com.kkorpse.less"
        minSdk 29
        targetSdk 36
        versionCode 15
        versionName "2.2.6"

        vectorDrawables.useSupportLibrary = true
    }

    signingConfigs {
        less {
            storeFile rootProject.file(keystoreProps.getProperty('storeFile', 'keystore/less-release.jks'))
            storePassword keystoreProps.getProperty('storePassword')
            keyAlias keystoreProps.getProperty('keyAlias')
            keyPassword keystoreProps.getProperty('keyPassword')
        }
    }

    buildTypes {
        debug {
            // debug 包也用项目签名，避免每台机器的 ~/.android/debug.keystore 不一致
            signingConfig signingConfigs.less
        }
        release {
            signingConfig signingConfigs.less
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }

    // 每次构建输出带版本号的文件名，例如 Less-v1.0.0-debug.apk
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            output.outputFileName = "Less-v${variant.versionName}-${variant.buildType.name}.apk"
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.activity:activity-ktx:1.10.1'
    implementation 'androidx.fragment:fragment-ktx:1.8.6'
    implementation 'androidx.palette:palette-ktx:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    implementation 'androidx.media3:media3-exoplayer:1.7.1'
    implementation 'androidx.media3:media3-ui:1.7.1'

    implementation 'io.coil-kt.coil3:coil:3.1.0'
    implementation 'io.coil-kt.coil3:coil-video:3.1.0'
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.1'
}
